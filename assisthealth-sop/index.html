<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AssistHealth SOP Training</title>

    <!-- SEO LOCK: Prevent search engines from indexing -->
    <meta name="robots" content="noindex, nofollow">

        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Minimal Professional B&W Palette */
        :root {
            --primary-color: #000000;
            --brand-green: #2D6A4F;
            --dark-gray: #111111;
            --medium-gray: #666666;
            --light-gray: #eaeaeb;
            --bg-color: #f7f7f8;
            --white: #ffffff;
            --danger: #e00000;
            --success: #2D6A4F;
            
            --border-radius: 6px;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 16px rgba(0,0,0,0.08);
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--dark-gray);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-container {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .logo {
            max-width: 48px;
            height: auto;
        }
        
        .app-name {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--brand-green);
        }

        header p {
            color: var(--medium-gray);
            font-size: 15px;
            margin-top: 8px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        .card {
            background: var(--white);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--light-gray);
            padding: 32px;
        }
        
        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--dark-gray);
            letter-spacing: -0.5px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--dark-gray);
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--light-gray);
            border-radius: var(--border-radius);
            font-size: 15px;
            font-family: inherit;
            color: var(--dark-gray);
            background-color: var(--white);
            transition: var(--transition);
        }
        
        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 1px var(--primary-color);
        }

        button {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--primary-color);
            color: var(--white);
            border: 1px solid var(--primary-color);
            border-radius: var(--border-radius);
            font-size: 15px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 8px;
        }

        button:hover {
            background-color: var(--white);
            color: var(--primary-color);
        }
        
        button:active {
            transform: scale(0.98);
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--medium-gray);
            border: 1px solid var(--light-gray);
            margin-top: 16px;
        }

        .secondary-btn:hover {
            background-color: var(--light-gray);
            color: var(--dark-gray);
        }

        .message {
            padding: 12px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background-color: #fff0f0;
            color: var(--danger);
            border: 1px solid #ffd0d0;
        }

        .success {
            background-color: #f0fff4;
            color: var(--success);
            border: 1px solid #d0f0db;
        }
        
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 16px 0;
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            color: var(--medium-gray);
            user-select: none;
        }
        
        .checkbox-container input {
            width: auto;
            margin-right: 8px;
            accent-color: var(--primary-color);
            cursor: pointer;
        }
        
        .forgot-password a {
            color: var(--medium-gray);
            text-decoration: none;
            font-size: 14px;
            transition: var(--transition);
        }
        
        .forgot-password a:hover {
            color: var(--primary-color);
        }
        
        /* Subtitle separator */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0 16px;
            color: var(--medium-gray);
            font-size: 14px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--light-gray);
        }
        .divider:not(:empty)::before {
            margin-right: 16px;
        }
        .divider:not(:empty)::after {
            margin-left: 16px;
        }

    </style>
</head>
<body>
        <header>
        <div class="logo-container">
            <img src="./assets/images/AH1.png" alt="AssistHealth Logo" class="logo">
            <span class="app-name">AssistHealth</span>
        </div>
        <p>Secure login for authorized personnel</p>
    </header>

    <main class="container">
        <div class="card" id="loginCard">
            <h2>Login</h2>
            <div id="loginMessage"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <div class="forgot-password">
                        <a href="#" id="forgotPassword">Forgot password?</a>
                    </div>
                </div>
                <button type="submit">Sign In</button>
            </form>
            
            <div class="divider">or</div>
            
            <button class="secondary-btn" id="showRegisterBtn">Create an account</button>
        </div>

        <div class="card" id="registerCard" style="display: none;">
            <h2>Register</h2>
            <div id="registerMessage"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerName">Full Name</label>
                    <input type="text" id="registerName" required placeholder="Jane Doe">
                </div>
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" required minlength="6" placeholder="At least 6 characters">
                </div>
                <button type="submit">Create Account</button>
            </form>
            
            <div class="divider">or</div>
            
            <button class="secondary-btn" id="showLoginBtn">Sign in to existing account</button>
        </div>
    </main>

    <!-- Firebase SDK -->
    <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="./assets/images/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <script>
        // Initialize Firebase
        const firebaseConfig = window.firebaseConfig;
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // DOM Elements
        const loginCard = document.getElementById('loginCard');
        const registerCard = document.getElementById('registerCard');
        const showRegisterBtn = document.getElementById('showRegisterBtn');
        const showLoginBtn = document.getElementById('showLoginBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginMessage = document.getElementById('loginMessage');
        const registerMessage = document.getElementById('registerMessage');

        // Toggle between login and register views
        showRegisterBtn.addEventListener('click', () => {
            loginCard.style.display = 'none';
            registerCard.style.display = 'block';
        });

        showLoginBtn.addEventListener('click', () => {
            registerCard.style.display = 'none';
            loginCard.style.display = 'block';
        });
        
        // Forgot password handler
        document.getElementById('forgotPassword').addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            if (!email) {
                showMessage(loginMessage, 'Please enter your email address first.', 'error');
                return;
            }
            
            // In a real app, this would trigger a password reset email
            showMessage(loginMessage, 'Password reset link sent to your email.', 'success');
        });

        // Login Handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                loginMessage.innerHTML = '';
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Check if user is admin
                const adminDoc = await db.collection('admins').doc(user.uid).get();
                if (adminDoc.exists && adminDoc.data().isAdmin) {
                    console.log('👑 User is admin, redirecting...');
                    window.location.href = 'admin.html';
                    return;
                }

                // Check user role from users collection
                const userDoc = await db.collection('users').doc(user.uid).get();
                if (userDoc.exists) {
                    const userData = userDoc.data();
                    console.log('👤 User data:', userData);
                    
                    // Ensure role exists, default to navigator if missing
                    const userRole = userData.role || 'navigator';
                    
                    console.log('👤 User role:', userRole);
                    
                    if (userRole === 'navigator') {
                        console.log('🧭 Redirecting to Navigator Dashboard...');
                        window.location.href = 'dashboard.html';
                    } else if (userRole === 'coordinator') {
                        console.log('🤝 Redirecting to Community Coordinator Dashboard...');
                        window.location.href = 'coordinator-dashboard.html';
                    } else {
                        console.error('❌ Unknown role:', userRole);
                        showMessage(loginMessage, `Invalid user role: ${userRole}. Please contact administrator.`, 'error');
                    }
                } else {
                    console.error('❌ User document not found');
                    showMessage(loginMessage, 'User data not found. Please contact administrator.', 'error');
                }
            } catch (error) {
                console.error("Login error:", error);
                showMessage(loginMessage, error.message, 'error');
            }
        });

        // Registration Handler
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                registerMessage.innerHTML = '';
                
                // Check if email is preapproved
                const preapprovedDoc = await db.collection('preapprovedEmails').doc(email).get();
                if (!preapprovedDoc.exists) {
                    throw new Error('Email not preapproved for registration. Please contact your administrator.');
                }

                // Get preapproved data
                const preapprovedData = preapprovedDoc.data();
                
                // Create user in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Create user document in Firestore
                const userRole = preapprovedData.role || 'navigator';
                console.log('📝 Creating user with role:', userRole);
                
                await db.collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    role: userRole,
                    status: 'active',
                    currentChapter: 1,
                    completedChapters: [],
                    chapterVersionsCompleted: {},
                    sopVersionCompleted: 0,
                    deadline: preapprovedData.deadline,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Redirect based on role
                const redirectRole = preapprovedData.role || 'navigator';
                if (redirectRole === 'coordinator') {
                    window.location.href = 'coordinator-dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error("Registration error:", error);
                showMessage(registerMessage, error.message, 'error');
            }
        });

        // Utility function to show messages
        function showMessage(container, message, type) {
            container.innerHTML = `<div class="message ${type}">${message}</div>`;
        }
    </script>
</body>
</html>
